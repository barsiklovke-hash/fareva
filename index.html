<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фарева — автосервис Honda и Subaru в Новосибирске | Онлайн-запись и расчёт цены</title>
<meta name="description" content="Ремонт и обслуживание Honda и Subaru, запчасти. Новосибирск, ул. Изыскателей, 44. Рассчитайте стоимость за минуту и запишитесь онлайн. Рейтинг 5,0 в 2ГИС.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="Фарева — автосервис Honda и Subaru в Новосибирске">
<meta property="og:description" content="Цена ремонта за минуту и онлайн-запись на свободное время.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111418'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231D4ED8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>
:root{--acc:#1D4ED8;--acc-h:#1E40AF;--acc-ink:#1E3A8A;--acc-soft:#EEF3FF;--acc-light:#8DB0FF}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#F5F6F8;color:#111418;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
section[id],#top{scroll-margin-top:76px}
a{color:var(--acc-h)}a:hover{color:var(--acc-ink)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:14px;font:700 16px/1 Manrope,system-ui,sans-serif;text-decoration:none;cursor:pointer;border:0;transition:background .15s ease,color .15s ease,transform .15s ease;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-red{background:var(--acc);color:#FFFFFF}.btn-red:hover{background:var(--acc-h);color:#FFFFFF}
.btn-ghost{background:transparent;color:#111418;box-shadow:inset 0 0 0 1.5px #111418}.btn-ghost:hover{background:#111418;color:#FFFFFF}
.btn-onDark{background:#FFFFFF;color:#111418}.btn-onDark:hover{background:#E9EBEE;color:#111418}
.btn-dark{background:#111418;color:#FFFFFF}.btn-dark:hover{background:#2A2F36;color:#FFFFFF}
.btn-soft{background:#F1F2F4;color:#111418}.btn-soft:hover{background:#E3E6EA;color:#111418}
.btn-ghostDark{background:transparent;color:#FFFFFF;box-shadow:inset 0 0 0 1.5px #3A414A}.btn-ghostDark:hover{background:#2A2F36;color:#FFFFFF}
.btn-sm{min-height:44px;padding:0 18px;font-size:15px;border-radius:12px}
.btn-xs{min-height:44px;padding:0 14px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.btn:focus-visible,.pill:focus-visible,.inp:focus-visible,.sw:focus-visible,.tab:focus-visible,a:focus-visible,.linkbtn:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}
.pill{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:52px;padding:12px 16px;border-radius:14px;background:#FFFFFF;border:1.5px solid #E1E4E8;color:#111418;text-align:left;cursor:pointer;font:600 15px/1.25 Manrope,system-ui,sans-serif;transition:border-color .15s ease,background .15s ease;width:100%}
.pill:hover{border-color:#111418}
.pill.on{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.pill.center{align-items:center;text-align:center}
.pill[disabled]{background:#ECEEF1;color:#6B737D;border-color:#ECEEF1;cursor:not-allowed}
.pill .sub{font-weight:500;font-size:13px;color:#5B6470}
.pill.on .sub{color:var(--acc-ink)}
.inp{width:100%;min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid #E1E4E8;background:#FFFFFF;font:500 16px Manrope,system-ui,sans-serif;color:#111418}
.inp::placeholder{color:#7A828C}
.inp:focus{border-color:#111418;outline:none}
.inp.bad{border-color:#C4221B;background:#FFF7F6}
.inp-sm{min-height:48px;border-radius:12px}
.errtext{color:#C4221B;font-size:14px;font-weight:600}
.card-link{text-decoration:none;color:inherit}
.card{background:#FFFFFF;border:1px solid #E7E9EC;border-radius:20px}
.dark-card{background:#121418;color:#FFFFFF}
.eyebrow{font-size:14px;font-weight:700;color:#A9B0BA;text-transform:uppercase;letter-spacing:.08em}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #E7E9EC}
.navlinks{display:flex;gap:28px;align-items:center;font-weight:600;font-size:15px}
.navlinks a{color:#111418;text-decoration:none}.navlinks a:hover{color:#C4221B}
.navphone{display:inline-flex;color:#111418;text-decoration:none;font-weight:700;font-size:16px;margin-right:4px}
.pulse{width:8px;height:8px;border-radius:50%;background:#17663A;box-shadow:0 0 0 0 rgba(23,102,58,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(23,102,58,0)}100%{box-shadow:0 0 0 0 rgba(23,102,58,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}html{scroll-behavior:auto}}
.brandwords{display:flex;flex-direction:column;font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:clamp(44px,4.4vw,60px);line-height:.98;letter-spacing:-.02em;user-select:none}
.brandwords span:first-child{color:var(--acc-light)}.brandwords span:last-child{color:transparent;-webkit-text-stroke:1.5px #8E99AB}
.heroprice{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px;padding:10px 18px;border-radius:14px;background:#1F2329;color:#FFFFFF;transition:background .15s ease;box-shadow:0 0 0 1px #2A2F36}
.heroprice:hover{background:#2A2F36;color:#FFFFFF}
.calc-dl{margin:0;display:flex;flex-direction:column;gap:12px;font-size:15px;padding-top:20px;border-top:1px solid #2A2F36}
.calc-dl div{display:flex;justify-content:space-between;gap:12px}
.calc-dl dt{color:#A9B0BA}.calc-dl dd{margin:0;font-weight:700}
.sum-dl{margin:0;display:flex;flex-direction:column;gap:16px}
.sum-dl dt{font-size:14px;color:#A9B0BA}.sum-dl dd{margin:4px 0 0;font-size:17px;font-weight:700}
.sum-dl dd.big{font-family:Unbounded,Manrope,sans-serif;font-size:28px;letter-spacing:-.02em}
.done-dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px 32px;width:100%;max-width:860px}
.done-dl dt{font-size:14px;color:#5B6470;font-weight:600}.done-dl dd{margin:4px 0 0;font-size:18px;font-weight:800}
.phone-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;border-radius:18px;background:#1C2026;color:#FFFFFF}
.phone-row:hover{background:#252A31;color:#FFFFFF}
.foot{background:#0B0D10;color:#A9B0BA;padding:28px clamp(16px,4vw,40px)}
.linkbtn{background:none;border:0;padding:0;min-height:44px;color:#C9CED5;font:600 14px Manrope,sans-serif;cursor:pointer;text-decoration:underline}
.badge{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;font:700 13px/1 Manrope,system-ui,sans-serif;white-space:nowrap}
.b-new{background:#FFE9E7;color:#A81B14}.b-ok{background:#E6EEFF;color:#1C47B0}.b-done{background:#E3F4E8;color:#17663A}.b-cancel{background:#EEF0F2;color:#4F5761}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px;background:#FFFFFF;border:1px solid #E7E9EC;border-radius:16px;align-self:flex-start}
.tab{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:transparent;color:#3A424C;font:700 15px Manrope,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab:hover{background:#E9EBEE}.tab.on{background:#111418;color:#FFFFFF}
.tab .cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--acc);color:#FFFFFF;font-size:12px}
.kpi{padding:22px;display:flex;flex-direction:column;gap:8px}
.kpi-l{font-size:14px;color:#5B6470;font-weight:700}
.kpi-v{font-family:Unbounded,sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em}
.kpi-s{font-size:14px;color:#5B6470}
.bar{height:8px;border-radius:999px;background:#EEF0F2;overflow:hidden}.bar div{height:100%;border-radius:999px;background:#111418}
.row{background:#FFFFFF;border:1px solid #E7E9EC;border-radius:18px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
.row.hl{border-color:var(--acc);box-shadow:0 0 0 3px #DCE6FF}
.sw{position:relative;width:56px;height:32px;flex:0 0 56px;border-radius:999px;border:0;background:#8E959E;cursor:pointer;transition:background .15s ease}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:left .15s ease}
.sw.on{background:#17663A}.sw.on::after{left:28px}
.mcta{display:none}
@media (min-width:900px){.sticky-card{position:sticky;top:96px}}
@media (max-width:900px){.navlinks{display:none}}
@media (max-width:640px){
  .navphone,.navcab{display:none}
  .mcta{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;gap:10px;padding:8px;border-radius:20px;background:#FFFFFF;box-shadow:0 8px 32px rgba(17,20,24,.18)}
  .foot{padding-bottom:110px}
}
</style>
